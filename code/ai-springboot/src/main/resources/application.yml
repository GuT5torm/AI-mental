spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mental_health_assistant}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: mental-health-hikari
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      # LocalDateTime 序列化为 ISO 字符串而非时间戳数组
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

#服务器配置
server:
  port: 1236

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 调试期输出 SQL，联调完成后可改为 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  # 跨域放行来源，逗号分隔（支持 * 通配）。同源反代部署不会触发 CORS，可留缺省；
  # 仅前后端分离域名部署时通过环境变量注入正式域名
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  ai:
    # 大模型提供方。当前使用 mock 实现跑通契约，
    # 接入真实模型后改为对应实现类的 havingValue（如 deepseek）
    provider: ${AI_PROVIDER:mock}
    # 以下六项仅在 provider=deepseek 时生效，均走环境变量，勿写入仓库
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    model: ${AI_MODEL:deepseek-chat}
    temperature: ${AI_TEMPERATURE:0.8}
    max-tokens: ${AI_MAX_TOKENS:2048}
    # 只约束响应头到达前的等待，SSE 推送期间不生效
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    # 用户自配 API Key 的落库加密主密钥（AES-GCM 派生）。未配置时保存接口明确报错；
    # 变更后已存密文无法解密，用户需重新保存
    config-secret: ${AI_CONFIG_SECRET:}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  file:
    url-prefix: /files
  emotion-capture:
    # 对话命中情绪关键词时自动记录情绪日志并投递 AI 评估的总开关；
    # 触发词在 emotion_keyword 表中维护（增删/停用即时生效，词带 1-3 级严重度）
    enabled: ${EMOTION_CAPTURE_ENABLED:true}
    # mood_score 非空。初始分按命中词等级推导（轻→4、中→3、重→2，同级≥3词再降1分），
    # 未命中任何词时用本默认分兜底；AI 评估完成后用 emotionScore 换算回写覆盖
    default-mood-score: ${EMOTION_CAPTURE_DEFAULT_MOOD_SCORE:3}

jwt:
  # HS256 要求密钥不少于 256 bit（base64 编码后填入）。未配置 JWT_SECRET 时，
  # 启动会临时生成随机密钥（重启后已签发 token 全部失效），本地与生产都建议显式注入
  secret: ${JWT_SECRET:}
  # 有效期，单位毫秒，默认 2 小时
  expiration: 7200000
