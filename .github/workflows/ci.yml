name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: 后端单元测试
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mental_health_assistant
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 初始化数据库（schema + seed）
        run: |
          psql "postgresql://postgres:123456@localhost:5432/mental_health_assistant" \
            -f code/ai-springboot/src/main/resources/db/schema.sql
          psql "postgresql://postgres:123456@localhost:5432/mental_health_assistant" \
            -f code/ai-springboot/src/main/resources/db/seed.sql

      - name: 运行单元测试
        working-directory: code/ai-springboot
        run: ./mvnw -B test
